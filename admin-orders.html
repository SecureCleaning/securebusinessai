<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders | Secure Business AI</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .admin-wrap { width: min(1080px, calc(100% - 32px)); margin: 40px auto; }
      .admin-card { background: rgba(255,255,255,0.95); border: 1px solid var(--line); border-radius: 20px; padding: 26px; box-shadow: var(--shadow); }
      .admin-field { display: grid; gap: 8px; margin-bottom: 16px; max-width: 420px; }
      .admin-field label { font-size: 13px; font-weight: 700; }
      .admin-field input { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: inherit; }
      .admin-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      .admin-status { font-size: 14px; color: var(--muted); min-height: 20px; margin: 0; }
      .admin-status.error { color: #c23b3b; }
      .summary { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 18px; }
      .pill { padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-dark); font-size: 13px; font-weight: 700; }
      table.orders { width: 100%; border-collapse: collapse; font-size: 14px; }
      table.orders th, table.orders td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
      table.orders th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
      .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: #eef2f7; color: var(--text); }
      .badge.paid, .badge.intake_submitted, .badge.draft_ready, .badge.delivered { background: #e7f4ec; color: #18794e; }
      .badge.checkout_started { background: #fdf0e3; color: #a15b16; }
      .yes { color: #18794e; font-weight: 700; } .no { color: var(--muted); }
      .muted { color: var(--muted); }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="/" aria-label="Secure Business AI home"><img src="./assets/secure-business-ai-horizontal.png" alt="Secure Business AI" /></a>
        <nav><a href="/admin">Content admin</a><a href="/">Back to site</a></nav>
      </div>
    </header>

    <main>
      <div class="admin-wrap">
        <section id="loginCard" class="admin-card">
          <p class="eyebrow">Orders</p>
          <h1 style="font-size:2rem;margin:0 0 10px;">AI Readiness Pack orders.</h1>
          <p class="muted">Enter the admin password to view order status and details.</p>
          <form id="loginForm" class="admin-field" style="margin-top:16px;">
            <label for="password">Admin password</label>
            <input type="password" id="password" autocomplete="current-password" required />
            <div class="admin-row">
              <button type="submit" class="button primary">Sign in</button>
              <p id="loginStatus" class="admin-status" aria-live="polite"></p>
            </div>
          </form>
        </section>

        <section id="ordersCard" class="admin-card hidden">
          <div class="admin-row" style="justify-content:space-between;">
            <h1 style="font-size:1.6rem;margin:0;">Orders</h1>
            <div class="admin-row">
              <button type="button" id="purgeBtn" class="button secondary">Purge old drafts</button>
              <button type="button" id="refreshBtn" class="button secondary">Refresh</button>
              <button type="button" id="logoutBtn" class="button secondary">Sign out</button>
            </div>
          </div>
          <div id="summary" class="summary"></div>
          <div class="admin-row" style="gap:8px;margin:4px 0 14px;">
            <label for="sampleEmail" style="font-size:13px;font-weight:700;">Email a sample Starter Guide to</label>
            <input type="email" id="sampleEmail" value="info@securebusinessai.com.au" style="border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;min-width:260px;" />
            <button type="button" id="sampleBtn" class="button secondary">Send sample</button>
            <p id="sampleStatus" class="admin-status" aria-live="polite"></p>
          </div>
          <p id="listStatus" class="admin-status"></p>
          <div style="overflow-x:auto;">
            <table class="orders">
              <thead>
                <tr>
                  <th>Created</th><th>Business</th><th>Website</th><th>Customer</th>
                  <th>Status</th><th>Emailed</th><th>Intake</th><th>Link expires</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <script>
      var PW = '';
      var loginCard = document.getElementById('loginCard');
      var ordersCard = document.getElementById('ordersCard');
      var loginForm = document.getElementById('loginForm');
      var loginStatus = document.getElementById('loginStatus');
      var listStatus = document.getElementById('listStatus');

      function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
      function fmtDate(s) { if (!s) return ''; var d = new Date(s); return isNaN(d) ? '' : d.toLocaleDateString('en-AU') + ' ' + d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' }); }

      function api(action, extra) {
        var payload = { action: action };
        if (extra) { for (var k in extra) { if (Object.prototype.hasOwnProperty.call(extra, k)) payload[k] = extra[k]; } }
        return fetch('/api/admin-orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + PW },
          body: JSON.stringify(payload)
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); });
      }

      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        PW = document.getElementById('password').value;
        loginStatus.textContent = 'Checking...'; loginStatus.className = 'admin-status';
        api('login').then(function (res) {
          if (!res.ok) { loginStatus.textContent = (res.data && res.data.error) || 'Sign in failed.'; loginStatus.className = 'admin-status error'; PW = ''; return; }
          loginCard.classList.add('hidden'); ordersCard.classList.remove('hidden'); load();
        }).catch(function () { loginStatus.textContent = 'Something went wrong.'; loginStatus.className = 'admin-status error'; });
      });

      function load() {
        listStatus.textContent = 'Loading orders...';
        api('list').then(function (res) {
          if (!res.ok) { listStatus.textContent = (res.data && res.data.error) || 'Could not load orders.'; listStatus.className = 'admin-status error'; return; }
          var orders = (res.data && res.data.orders) || [];
          render(orders);
          listStatus.textContent = orders.length + ' orders';
          listStatus.className = 'admin-status';
        }).catch(function () { listStatus.textContent = 'Something went wrong.'; listStatus.className = 'admin-status error'; });
      }

      function render(orders) {
        var counts = {};
        orders.forEach(function (o) { counts[o.status] = (counts[o.status] || 0) + 1; });
        document.getElementById('summary').innerHTML = Object.keys(counts).map(function (k) {
          return '<span class="pill">' + esc(k) + ': ' + counts[k] + '</span>';
        }).join('') || '<span class="muted">No orders yet.</span>';

        document.getElementById('rows').innerHTML = orders.map(function (o) {
          var web = o.website_url ? '<a href="' + esc(o.website_url) + '" target="_blank" rel="noopener">' + esc(o.website_url.replace(/^https?:\/\//, '')) + '</a>' : '';
          return '<tr>' +
            '<td class="muted">' + esc(fmtDate(o.created_at)) + '</td>' +
            '<td>' + esc(o.business_name) + '</td>' +
            '<td>' + web + '</td>' +
            '<td>' + esc(o.customer_name) + '<br /><span class="muted">' + esc(o.customer_email) + '</span></td>' +
            '<td><span class="badge ' + esc(o.status) + '">' + esc(o.status) + '</span></td>' +
            '<td>' + (o.workspace_emailed ? '<span class="yes">yes</span>' : '<span class="no">no</span>') + '</td>' +
            '<td>' + (o.intake_filled ? '<span class="yes">yes</span>' : '<span class="no">no</span>') + '</td>' +
            '<td class="muted">' + esc(fmtDate(o.access_expires_at)) + '</td>' +
          '</tr>';
        }).join('');
      }

      document.getElementById('purgeBtn').addEventListener('click', function () {
        if (!confirm('Delete unpaid draft orders older than 7 days? Paid and completed orders are never affected.')) return;
        listStatus.textContent = 'Purging...'; listStatus.className = 'admin-status';
        api('purge_abandoned').then(function (res) {
          if (!res.ok) { listStatus.textContent = (res.data && res.data.error) || 'Purge failed.'; listStatus.className = 'admin-status error'; return; }
          var n = (res.data && res.data.purged) || 0;
          listStatus.textContent = 'Removed ' + n + ' abandoned draft' + (n === 1 ? '' : 's') + '.';
          load();
        }).catch(function () { listStatus.textContent = 'Something went wrong.'; listStatus.className = 'admin-status error'; });
      });

      document.getElementById('sampleBtn').addEventListener('click', function () {
        var sampleStatus = document.getElementById('sampleStatus');
        var email = document.getElementById('sampleEmail').value.trim();
        sampleStatus.textContent = 'Sending...'; sampleStatus.className = 'admin-status';
        api('send_sample', { email: email }).then(function (res) {
          if (!res.ok) { sampleStatus.textContent = (res.data && res.data.error) || 'Send failed.'; sampleStatus.className = 'admin-status error'; return; }
          sampleStatus.textContent = 'Sent to ' + ((res.data && res.data.sentTo) || email) + '.';
          sampleStatus.className = 'admin-status';
        }).catch(function () { sampleStatus.textContent = 'Something went wrong.'; sampleStatus.className = 'admin-status error'; });
      });

      document.getElementById('refreshBtn').addEventListener('click', load);
      document.getElementById('logoutBtn').addEventListener('click', function () {
        PW = ''; ordersCard.classList.add('hidden'); loginCard.classList.remove('hidden');
        document.getElementById('password').value = ''; loginStatus.textContent = '';
      });
    </script>
  </body>
</html>
